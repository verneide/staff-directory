name: Deploy to SiteGround

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  issues: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Generate minified application assets
        run: |
          npx --yes --package clean-css-cli@5.6.3 cleancss -o assets/themes/vern-eide-staff/inc/assets/css/listing-css.min.css assets/themes/vern-eide-staff/inc/assets/css/listing.css
          npx --yes --package clean-css-cli@5.6.3 cleancss -o assets/themes/vern-eide-staff/inc/assets/css/ve-staff-display.min.css assets/themes/vern-eide-staff/inc/assets/css/listing-display.css
          npx --yes --package clean-css-cli@5.6.3 cleancss -o assets/themes/vern-eide-staff/wp-bootstrap-starter-style.min.css assets/themes/vern-eide-staff/style.css
          npx --yes --package clean-css-cli@5.6.3 cleancss -o assets/plugins/ve-staff/public/css/ve-staff.min.css assets/plugins/ve-staff/public/css/ve-staff-public.css
          npx --yes --package terser@5.43.1 terser assets/themes/vern-eide-staff/inc/assets/js/theme-script.js --compress --mangle --output assets/themes/vern-eide-staff/inc/assets/js/theme-script.min.js
          npx --yes --package terser@5.43.1 terser assets/themes/vern-eide-staff/inc/assets/js/skip-link-focus-fix.js --compress --mangle --output assets/themes/vern-eide-staff/inc/assets/js/skip-link-focus-fix.min.js

      - name: Install rsync
        run: sudo apt-get update && sudo apt-get install -y rsync

      - name: Setup SSH
        run: |
          setup_ssh() {
            mkdir -p ~/.ssh
            printf '%s\n' "${{ secrets.SG_SSH_KEY }}" > ~/.ssh/id_ed25519
            chmod 600 ~/.ssh/id_ed25519
            ssh-keyscan -T 30 -p "${{ secrets.SG_PORT }}" "${{ secrets.SG_HOST }}" > ~/.ssh/known_hosts
          }
          for attempt in 1 2 3; do
            setup_ssh && exit 0
            if [ "$attempt" -lt 3 ]; then
              echo "::warning::SSH setup failed on attempt $attempt; retrying in 180 seconds."
              sleep 180
            fi
          done
          echo "::error::SSH setup failed after three attempts."
          exit 1

      - name: Deploy plugin and theme
        run: |
          deploy() {
            rsync -avz --delete -e "ssh -p ${{ secrets.SG_PORT }}" assets/plugins/ve-staff/ "${{ secrets.SG_USER }}@${{ secrets.SG_HOST }}:/home/customer/www/staff.eideweb.com/public_html/assets/plugins/ve-staff/" &&
            rsync -avz --delete -e "ssh -p ${{ secrets.SG_PORT }}" assets/themes/vern-eide-staff/ "${{ secrets.SG_USER }}@${{ secrets.SG_HOST }}:/home/customer/www/staff.eideweb.com/public_html/assets/themes/vern-eide-staff/"
          }
          for attempt in 1 2 3; do
            deploy && exit 0
            if [ "$attempt" -lt 3 ]; then
              echo "::warning::Deployment failed on attempt $attempt; retrying in 180 seconds."
              sleep 180
            fi
          done
          echo "::error::Deployment failed after three attempts."
          exit 1

      - name: Notify complete deployment failure
        if: ${{ failure() }}
        uses: actions/github-script@v8
        with:
          script: |
            const title = `Deployment failed: run #${context.runNumber}`;
            const body = [
              'The SiteGround deployment failed after all automatic retries.',
              '',
              `Workflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              `Commit: ${context.sha}`,
            ].join('\n');
            await github.rest.issues.create({ ...context.repo, title, body });
